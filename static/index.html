<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Shop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #1a1008;
      --card: #2a1f10;
      --accent: #c8873a;
      --accent2: #e6a455;
      --text: #f5e6d0;
      --muted: #8a7060;
      --green: #4caf7d;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 100px;
    }

    /* HEADER */
    .header {
      background: linear-gradient(135deg, #2a1208, #1a0e05);
      padding: 24px 20px 20px;
      text-align: center;
      border-bottom: 1px solid #3a2510;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    .header p { color: var(--muted); font-size: 13px; margin-top: 4px; }

    /* CATEGORIES */
    .categories {
      display: flex;
      gap: 10px;
      padding: 16px 20px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .categories::-webkit-scrollbar { display: none; }
    .cat-btn {
      flex-shrink: 0;
      padding: 8px 18px;
      border-radius: 20px;
      border: 1.5px solid #3a2510;
      background: var(--card);
      color: var(--muted);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .cat-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    /* MENU */
    .section-title {
      padding: 8px 20px 12px;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }
    .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 16px;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #3a2510;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      position: relative;
    }
    .card:active { transform: scale(0.97); }
    .card-emoji {
      font-size: 52px;
      text-align: center;
      padding: 20px 10px 10px;
      background: linear-gradient(180deg, #2e1a0a, #231408);
    }
    .card-body { padding: 10px 12px 14px; }
    .card-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }
    .card-desc {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .price {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
    }
    .add-btn {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .add-btn:active { background: var(--accent2); }
    .badge {
      position: absolute;
      top: 10px; right: 10px;
      background: var(--accent);
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 10px;
    }

    /* CART */
    .cart-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 12px 16px;
      background: linear-gradient(180deg, transparent, var(--bg) 20%);
      padding-top: 30px;
    }
    .cart-btn {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: opacity 0.2s;
    }
    .cart-btn:disabled { opacity: 0.4; }
    .cart-btn .cart-count {
      background: rgba(255,255,255,0.25);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 14px;
    }

    /* CART PAGE */
    .cart-page {
      display: none;
      padding: 20px 16px;
    }
    .cart-page.show { display: block; }
    .cart-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: var(--card);
      border-radius: 14px;
      margin-bottom: 10px;
      border: 1px solid #3a2510;
    }
    .cart-item-emoji { font-size: 32px; }
    .cart-item-info { flex: 1; }
    .cart-item-name { font-size: 15px; font-weight: 600; }
    .cart-item-price { font-size: 13px; color: var(--accent); margin-top: 2px; }
    .qty-ctrl {
      display: flex; align-items: center; gap: 10px;
    }
    .qty-btn {
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 1.5px solid var(--accent);
      background: transparent;
      color: var(--accent);
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .qty-num { font-size: 16px; font-weight: 700; min-width: 20px; text-align: center; }

    .order-total {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      margin: 16px 0;
      border: 1px solid #3a2510;
    }
    .order-total-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--muted);
    }
    .order-total-main {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      padding-top: 10px;
      border-top: 1px solid #3a2510;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      font-size: 15px;
      cursor: pointer;
      margin-bottom: 20px;
      background: none;
      border: none;
    }

    /* SUCCESS */
    .success-page {
      display: none;
      text-align: center;
      padding: 60px 20px;
    }
    .success-page.show { display: block; }
    .success-icon { font-size: 80px; margin-bottom: 20px; }
    .success-page h2 { font-size: 24px; font-weight: 800; margin-bottom: 10px; }
    .success-page p { color: var(--muted); font-size: 15px; line-height: 1.6; }
    .order-num {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 24px;
      background: var(--card);
      border-radius: 12px;
      font-size: 22px;
      font-weight: 800;
      color: var(--accent);
      border: 1.5px solid #3a2510;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- ГЛАВНАЯ СТРАНИЦА -->
<div id="mainPage">
  <div class="header">
    <h1>☕ Coffee Shop</h1>
    <p>Свежий кофе и вкусная еда</p>
  </div>

  <div class="categories">
    <button class="cat-btn active" onclick="filterMenu('all')">Всё</button>
    <button class="cat-btn" onclick="filterMenu('coffee')">☕ Кофе</button>
    <button class="cat-btn" onclick="filterMenu('tea')">🍵 Чай</button>
    <button class="cat-btn" onclick="filterMenu('food')">🥐 Еда</button>
    <button class="cat-btn" onclick="filterMenu('cold')">🧊 Холодное</button>
  </div>

  <div class="section-title">Меню</div>
  <div class="menu-grid" id="menuGrid"></div>

  <div class="cart-bar">
    <button class="cart-btn" id="cartBtn" onclick="showCart()" disabled>
      <span>🛒 Корзина</span>
      <span class="cart-count" id="cartCount">0 товаров • 0 ₽</span>
    </button>
  </div>
</div>

<!-- КОРЗИНА -->
<div id="cartPage" class="cart-page">
  <button class="back-btn" onclick="showMain()">← Назад</button>
  <div class="section-title" style="padding:0 0 16px">Ваш заказ</div>
  <div id="cartItems"></div>
  <div class="order-total">
    <div class="order-total-row"><span>Товаров</span><span id="totalCount">0</span></div>
    <div class="order-total-main"><span>Итого</span><span id="totalPrice">0 ₽</span></div>
  </div>
  <div class="cart-bar">
    <button class="cart-btn" onclick="placeOrder()">
      <span>Оформить заказ</span>
      <span class="cart-count" id="orderTotal">0 ₽</span>
    </button>
  </div>
</div>

<!-- УСПЕХ -->
<div id="successPage" class="success-page">
  <div class="success-icon">✅</div>
  <h2>Заказ принят!</h2>
  <p>Мы уже готовим ваш заказ.<br>Ожидайте уведомление.</p>
  <div class="order-num" id="orderNum">#0000</div>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.expand();
  tg.setBackgroundColor('#1a1008');

  const MENU = [
    { id:1, name:'Эспрессо', desc:'Крепкий, насыщенный', price:150, emoji:'☕', cat:'coffee' },
    { id:2, name:'Капучино', desc:'Нежная молочная пенка', price:280, emoji:'☕', cat:'coffee', popular:true },
    { id:3, name:'Латте', desc:'Мягкий вкус, много молока', price:300, emoji:'🥛', cat:'coffee' },
    { id:4, name:'Американо', desc:'Длинный, лёгкий кофе', price:200, emoji:'☕', cat:'coffee' },
    { id:5, name:'Раф', desc:'Сливки + ваниль', price:350, emoji:'🤍', cat:'coffee', popular:true },
    { id:6, name:'Зелёный чай', desc:'Лёгкий, освежающий', price:180, emoji:'🍵', cat:'tea' },
    { id:7, name:'Чёрный чай', desc:'Классика', price:150, emoji:'🫖', cat:'tea' },
    { id:8, name:'Матча латте', desc:'Японский зелёный чай', price:320, emoji:'🍵', cat:'tea', popular:true },
    { id:9, name:'Круассан', desc:'Масляный, хрустящий', price:220, emoji:'🥐', cat:'food' },
    { id:10, name:'Чизкейк', desc:'Нью-Йорк стайл', price:280, emoji:'🍰', cat:'food', popular:true },
    { id:11, name:'Тост с авокадо', desc:'Здоровый завтрак', price:350, emoji:'🥑', cat:'food' },
    { id:12, name:'Холодный латте', desc:'Со льдом', price:320, emoji:'🧊', cat:'cold' },
    { id:13, name:'Фраппе', desc:'Взбитый со льдом', price:350, emoji:'🥤', cat:'cold', popular:true },
    { id:14, name:'Лимонад', desc:'Домашний', price:250, emoji:'🍋', cat:'cold' },
  ];

  let cart = {};
  let currentFilter = 'all';

  function renderMenu() {
    const grid = document.getElementById('menuGrid');
    const items = currentFilter === 'all' ? MENU : MENU.filter(i => i.cat === currentFilter);
    grid.innerHTML = items.map(item => `
      <div class="card" onclick="addToCart(${item.id})">
        ${item.popular ? '<div class="badge">Хит</div>' : ''}
        <div class="card-emoji">${item.emoji}</div>
        <div class="card-body">
          <div class="card-name">${item.name}</div>
          <div class="card-desc">${item.desc}</div>
          <div class="card-footer">
            <span class="price">${item.price} ₽</span>
            <button class="add-btn" onclick="event.stopPropagation();addToCart(${item.id})">+</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  function filterMenu(cat) {
    currentFilter = cat;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    renderMenu();
  }

  function addToCart(id) {
    cart[id] = (cart[id] || 0) + 1;
    updateCartBar();
    // анимация
    const btn = event.target.closest('.card')?.querySelector('.add-btn');
    if (btn) { btn.textContent = '✓'; setTimeout(() => btn.textContent = '+', 500); }
  }

  function updateCartBar() {
    const total = Object.entries(cart).reduce((s,[id,qty]) => {
      const item = MENU.find(i => i.id == id);
      return s + (item ? item.price * qty : 0);
    }, 0);
    const count = Object.values(cart).reduce((s,q) => s+q, 0);
    const btn = document.getElementById('cartBtn');
    btn.disabled = count === 0;
    document.getElementById('cartCount').textContent = `${count} шт • ${total} ₽`;
  }

  function showCart() {
    document.getElementById('mainPage').classList.add('hidden');
    document.getElementById('cartPage').classList.add('show');
    renderCart();
  }

  function showMain() {
    document.getElementById('mainPage').classList.remove('hidden');
    document.getElementById('cartPage').classList.remove('show');
  }

  function renderCart() {
    const container = document.getElementById('cartItems');
    container.innerHTML = Object.entries(cart).map(([id, qty]) => {
      const item = MENU.find(i => i.id == id);
      if (!item) return '';
      return `
        <div class="cart-item">
          <div class="cart-item-emoji">${item.emoji}</div>
          <div class="cart-item-info">
            <div class="cart-item-name">${item.name}</div>
            <div class="cart-item-price">${item.price * qty} ₽</div>
          </div>
          <div class="qty-ctrl">
            <button class="qty-btn" onclick="changeQty(${id}, -1)">−</button>
            <span class="qty-num">${qty}</span>
            <button class="qty-btn" onclick="changeQty(${id}, 1)">+</button>
          </div>
        </div>
      `;
    }).join('');

    const total = Object.entries(cart).reduce((s,[id,qty]) => {
      const item = MENU.find(i => i.id == id);
      return s + (item ? item.price * qty : 0);
    }, 0);
    const count = Object.values(cart).reduce((s,q) => s+q, 0);
    document.getElementById('totalCount').textContent = count;
    document.getElementById('totalPrice').textContent = total + ' ₽';
    document.getElementById('orderTotal').textContent = total + ' ₽';
  }

  function changeQty(id, delta) {
    cart[id] = (cart[id] || 0) + delta;
    if (cart[id] <= 0) delete cart[id];
    if (Object.keys(cart).length === 0) { showMain(); return; }
    updateCartBar();
    renderCart();
  }

  function placeOrder() {
    const items = Object.entries(cart).map(([id, qty]) => {
      const item = MENU.find(i => i.id == id);
      return { id: parseInt(id), name: item.name, qty, price: item.price };
    });
    const total = items.reduce((s,i) => s + i.price * i.qty, 0);

    fetch('/api/order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        user_id: tg.initDataUnsafe?.user?.id || 0,
        username: tg.initDataUnsafe?.user?.username || 'гость',
        items,
        total
      })
    })
    .then(r => r.json())
    .then(data => {
      document.getElementById('cartPage').classList.remove('show');
      document.getElementById('successPage').classList.add('show');
      document.getElementById('orderNum').textContent = '#' + String(data.order_id).padStart(4, '0');
      cart = {};
      updateCartBar();
    })
    .catch(() => alert('Ошибка. Попробуйте снова.'));
  }

  renderMenu();
</script>
</body>
</html>
